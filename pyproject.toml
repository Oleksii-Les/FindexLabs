[project]
name = "findex"
version = "1.0.0"
description = "A small full-text search engine: streaming indexer, BM25 ranking, query language, CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "findex authors" }]
keywords = ["search", "information-retrieval", "bm25", "inverted-index"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
findex = "findex.cli:app"

[project.optional-dependencies]
semantic = [
    "scipy>=1.18.1",
]
minilm = [
    "sentence-transformers>=6.3.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "matplotlib>=3.11.2",
    "py-spy>=0.4.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "scalene>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in strings/comments is intentional

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --benchmark-disable"  # benchmarks run once, as ordinary tests; CI times them with --benchmark-enable
markers = ["slow: tests that take longer than about a second (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if sys.platform == .win32.:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
