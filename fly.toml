# Fly.io alternative:  fly launch --no-deploy --copy-config && fly deploy
app = "findex-CHANGE-ME"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  INDEX_PATH = "/data/index.bin"
  CORPUS_ROOT = "/data/books"
  WEB_CONCURRENCY = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
